<!DOCTYPE html>
<html>
<head>
    <title>BitTorrent Swarm Dashboard</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body { margin: 0; background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex;}
        #mynetwork { flex-grow: 1; height: 100vh; }
        #title { position: absolute; top: 15px; left: 20px; z-index: 10; text-shadow: 2px 2px 4px #000000; }
        
        #log-panel { width: 350px; height: 100vh; background-color: #0f172a; border-left: 2px solid #334155; display: flex; flex-direction: column;}
        #log-header { padding: 15px; background-color: #1e293b; border-bottom: 1px solid #334155; font-weight: bold;}
        #log-content { flex-grow: 1; overflow-y: auto; padding: 10px; font-size: 13px; font-family: monospace;}
        
        .log-entry { margin-bottom: 8px; padding-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .log-PING { color: #ff5555; }
        .log-PONG { color: #ff9900; } 
        .log-PIECE { color: #55ff55; }
        .log-REQ { color: #ffff55; }
        .log-time { color: #94a3b8; font-size: 11px; margin-right: 8px;}
    </style>
</head>
<body>
    <h2 id="title">Real-Time P2P Topology & Traffic</h2>
    <div id="mynetwork"></div>
    
    <div id="log-panel">
        <div id="log-header">Traffic Event Log (Persistent)</div>
        <div id="log-content"></div>
    </div>

    <script type="text/javascript">
        var container = document.getElementById('mynetwork');
        var nodes = new vis.DataSet();
        var edges = new vis.DataSet();

        var network = new vis.Network(container, {nodes: nodes, edges: edges}, {
            physics: { stabilization: false, barnesHut: { gravitationalConstant: -10000 } },
            edges: { smooth: { type: 'dynamic' } } 
        });

        let seenLogIds = new Set(); 
        let visualQueue = [];

        function fetchAndUpdateGraph() {
            fetch('/api/network')
                .then(response => response.json())
                .then(data => {
                    if (!nodes.get('Tracker')) {
                        nodes.add({id: 'Tracker', label: 'Tracker Server', shape: 'database', color: '#e94560', size: 40});
                    }
                    
                    let colorIndex = 0;
                    const colors = ['#0f3460', '#4caf50', '#9c27b0'];
                    
                    for (const [info_hash, peers] of Object.entries(data.swarm)) {
                        let torrentId = 'Swarm: ' + info_hash.substring(0, 8);
                        if (!nodes.get(torrentId)) {
                            nodes.add({id: torrentId, label: torrentId, shape: 'box', color: colors[colorIndex % colors.length], font: {color: 'white'}});
                            edges.add({id: 'tr_'+torrentId, from: 'Tracker', to: torrentId, dashes: true, color: 'gray'});
                        }
                        
                        peers.forEach(peer => {
                            let peerId = peer.ip + ':' + peer.port;
                            if (!nodes.get(peerId)) {
                                nodes.add({id: peerId, label: 'Peer ' + peer.port, shape: 'dot', size: 18, color: '#f9a826'});
                            }
                            let edgeId = 'swarm_' + peerId + '_' + torrentId;
                            if (!edges.get(edgeId)) {
                                edges.add({id: edgeId, from: peerId, to: torrentId, color: 'rgba(255,255,255,0.1)', dashes: true});
                            }
                        });
                        colorIndex++;
                    }

                    let logContainer = document.getElementById('log-content');
                    if (data.links) {
                        data.links.forEach(link => {
                            if (!seenLogIds.has(link.id)) {
                                seenLogIds.add(link.id); 
                                
                                let baseType = link.type.split(' ')[0];
                                
                                let logItem = document.createElement('div');
                                logItem.className = 'log-entry log-' + baseType; 
                                let timestamp = new Date().toLocaleTimeString('en-US', { hour12: false, hour: "numeric", minute: "numeric", second: "numeric" });
                                
                                logItem.innerHTML = `<span class="log-time">[${timestamp}]</span> <strong>${link.type}</strong>: ${link.from} ➔ ${link.to}`;
                                logContainer.prepend(logItem);
                                
                                visualQueue.push(link);
                            }
                        });
                    }
                })
                .catch(err => console.error("Error fetching network data:", err));
        }

        setInterval(() => {
            let processCount = visualQueue.length > 6 ? 3 : 1; 
            
            for (let i = 0; i < processCount; i++) {
                if (visualQueue.length > 0) {
                    let link = visualQueue.shift(); 
                    let baseType = link.type.split(' ')[0];

                    let edgeColor = '#00e5ff';
                    let edgeWidth = 2;
                    if (baseType === 'PING') { edgeColor = '#ff3333'; }
                    if (baseType === 'PONG') { edgeColor = '#ff9900'; }
                    if (baseType === 'PIECE') { edgeColor = '#00ff00'; edgeWidth = 4; }
                    if (baseType === 'REQ') { edgeColor = '#ffff00'; }

                    if (!edges.get(link.id)) {
                        edges.add({
                            id: link.id,
                            from: link.from,
                            to: link.to,
                            label: link.type,
                            color: { color: edgeColor },
                            width: edgeWidth,
                            arrows: { to: { enabled: true, scaleFactor: 1.2 } },
                            font: { align: 'top', color: edgeColor, strokeWidth: 0, size: 12, background: 'rgba(26,26,46,0.8)' },
                            dashes: [5, 5]
                        });
                    }
                    
                    setTimeout(() => {
                        if (edges.get(link.id)) {
                            edges.remove(link.id);
                        }
                    }, 2500);
                }
            }
        }, 600);

        setInterval(fetchAndUpdateGraph, 1000);
        fetchAndUpdateGraph();
    </script>
</body>
</html>
