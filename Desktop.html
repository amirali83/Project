<!DOCTYPE html>
<html>
<head>
    <title>BitTorrent Swarm Dashboard</title>
    <script type="text/javascript" src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <style type="text/css">
        body { margin: 0; background-color: #1a1a2e; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;}
        #mynetwork { width: 100vw; height: 100vh; }
        #title { position: absolute; top: 15px; left: 20px; z-index: 10; text-shadow: 2px 2px 4px #000000; }
    </style>
</head>
<body>
    <h2 id="title">Real-Time P2P Topology & Traffic</h2>
    <div id="mynetwork"></div>
    <script type="text/javascript">
        var container = document.getElementById('mynetwork');
        var nodes = new vis.DataSet();
        var edges = new vis.DataSet();

        var network = new vis.Network(container, {nodes: nodes, edges: edges}, {
            physics: { stabilization: false, barnesHut: { gravitationalConstant: -10000 } },
            edges: { smooth: { type: 'curvedCW', roundness: 0.2 } }
        });

        let peerSet = new Set();
        let activeTrafficEdges = new Set();

        function fetchAndUpdateGraph() {
            fetch('/api/network')
                .then(response => response.json())
                .then(data => {
                    // 1. آپدیت نودها
                    if (!nodes.get('Tracker')) {
                        nodes.add({id: 'Tracker', label: 'Tracker Server', shape: 'database', color: '#e94560', size: 40});
                    }
                    
                    let colorIndex = 0;
                    const colors = ['#0f3460', '#4caf50', '#9c27b0'];
                    
                    for (const [info_hash, peers] of Object.entries(data.swarm)) {
                        let torrentId = 'Swarm: ' + info_hash.substring(0, 8);
                        if (!nodes.get(torrentId)) {
                            nodes.add({id: torrentId, label: torrentId, shape: 'box', color: colors[colorIndex % colors.length], font: {color: 'white'}});
                            edges.add({id: 'tr_'+torrentId, from: 'Tracker', to: torrentId, dashes: true, color: 'gray'});
                        }
                        
                        peers.forEach(peer => {
                            let peerId = peer.ip + ':' + peer.port;
                            if (!nodes.get(peerId)) {
                                nodes.add({id: peerId, label: 'Peer ' + peer.port, shape: 'dot', size: 18, color: '#f9a826'});
                            }
                            let edgeId = 'swarm_' + peerId + '_' + torrentId;
                            if (!edges.get(edgeId)) {
                                edges.add({id: edgeId, from: peerId, to: torrentId, color: 'rgba(255,255,255,0.1)', dashes: true});
                            }
                        });
                        colorIndex++;
                    }

                    // 2. مدیریت انیمیشن ترافیک (PING, PIECE, REQUEST)
                    let currentTrafficIds = new Set();
                    
                    if (data.links) {
                        data.links.forEach(link => {
                            let linkId = link.id;
                            currentTrafficIds.add(linkId);
                            
                            if (!edges.get(linkId)) {
                                // تعیین رنگ بر اساس نوع پیام
                                let edgeColor = '#00e5ff'; // پیش‌فرض
                                let edgeWidth = 2;
                                if (link.type === 'PING') { edgeColor = '#ff3333'; } // خط قرمز برای پینگ
                                if (link.type === 'PIECE') { edgeColor = '#00ff00'; edgeWidth = 4; } // خط سبز و ضخیم برای ارسال فایل
                                if (link.type === 'REQ') { edgeColor = '#ffff00'; } // خط زرد برای درخواست
                                
                                edges.add({
                                    id: linkId,
                                    from: link.from,
                                    to: link.to,
                                    label: link.type,
                                    color: { color: edgeColor },
                                    width: edgeWidth,
                                    arrows: { to: { enabled: true, scaleFactor: 1.2 } },
                                    font: { align: 'top', color: edgeColor, strokeWidth: 0, size: 12 },
                                    dashes: [5, 5] // ایجاد حالت خط‌چین برای القای حس حرکت
                                });
                                activeTrafficEdges.add(linkId);
                            }
                        });
                    }

                    // 3. پاک کردن ترافیک‌های قدیمی که دیگر در API نیستند
                    activeTrafficEdges.forEach(edgeId => {
                        if (!currentTrafficIds.has(edgeId)) {
                            edges.remove(edgeId);
                            activeTrafficEdges.delete(edgeId);
                        }
                    });
                })
                .catch(err => console.error("Error fetching network data:", err));
        }

        setInterval(fetchAndUpdateGraph, 1000); // سرعت رفرش را به ۱ ثانیه کاهش دادیم
        fetchAndUpdateGraph();
    </script>
</body>
</html>
